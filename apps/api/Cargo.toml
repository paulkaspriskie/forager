[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
fmp-client = { path = "../../crates/fmp-client" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
moka = { version = "0.12", features = ["future"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["trace"] }
dotenvy = "0.15"
anyhow = "1"