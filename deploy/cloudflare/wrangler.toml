name = "forager-api"
main = "src/index.ts"
compatibility_date = "2026-11-25"

[[containers]]
class_name = "ForagerApi"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "../../apps/api/Dockerfile"
build_context = "../.."

[[routes]]
pattern = "truffleresearch.com/api/*"
zone_name = "truffleresearch.com"

[[durable_objects.bindings]]
name = "FORAGER_API"
class_name = "ForagerApi"

[exports.ForagerApi]
type = "durable-object"
storage = "sqlite"